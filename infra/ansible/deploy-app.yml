---
- name: Configure app server and deploy ShelfSense
  hosts: app
  become: true

  vars:
    app_image: ghcr.io/jbaramakram/shelfsense:latest
    app_port: 5000
    db_host: "{{ db_host | default('13.62.51.191') }}"

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install Docker Compose
      apt:
        name: docker-compose
        state: present

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Configure nginx as reverse proxy
      copy:
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://localhost:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
        dest: /etc/nginx/sites-available/default
      notify: restart nginx

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Stop existing container if running
      shell: docker rm -f shelfsense-app 2>/dev/null || true

    - name: Start ShelfSense container with host network
      shell: >
        docker run -d
        --name shelfsense-app
        --network host
        --restart unless-stopped
        -e DATABASE_URL="postgresql://shelfsense_user:shelfsense_pass@{{ db_host }}:5432/shelfsense"
        {{ app_image }}

    - name: Wait for app to be ready
      uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      retries: 10
      delay: 5
      register: health_result

    - name: Print health check result
      debug:
        msg: "App is healthy: {{ health_result.json }}"

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
