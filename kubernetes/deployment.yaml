apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfsense
  namespace: default
  labels:
    app: shelfsense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shelfsense
  template:
    metadata:
      labels:
        app: shelfsense
    spec:
      containers:
        - name: shelfsense
          image: ghcr.io/jbaramakram/shelfsense:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: shelfsense-config
            - secretRef:
                name: shelfsense-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
