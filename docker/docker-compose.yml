version: '3.8'

services:

  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: shelfsense-db
    environment:
      POSTGRES_DB: shelfsense
      POSTGRES_USER: shelfsense_user
      POSTGRES_PASSWORD: shelfsense_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfsense_user -d shelfsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Application ────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shelfsense-app
    environment:
      DATABASE_URL: postgresql://shelfsense_user:shelfsense_pass@db:5432/shelfsense
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Named Volumes ────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
